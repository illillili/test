<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>불러오는 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<link rel="stylesheet" href="engine/style.css">
</head>
<body>
<!-- 이 파일은 고칠 필요가 없습니다. 대본은 story 폴더에 있어요. -->
<div class="stage">
  <div class="topbar">
    <div class="brand" id="brand"></div>
    <div class="hp" id="hp" hidden aria-label="재판장의 신뢰도"></div>
    <button class="btn-record" id="btnRecord" type="button">법정기록</button>
    <button class="btn-record" id="btnMenu" type="button">메뉴</button>
  </div>
  <div class="placard" id="placard">
    <div class="time" id="time"></div>
    <div class="loc" id="loc"></div>
  </div>
  <div class="middle" id="middle"></div>
  <div class="presented" id="presented" hidden aria-live="polite"></div>
  <div class="dialog" id="dialog" tabindex="0" role="button" aria-label="다음 대사">
    <div class="nameplate" id="name" hidden></div>
    <div class="text" id="text"></div>
    <div class="next-hint" id="hint" hidden>▼</div>
  </div>
  <div id="controls"></div>
</div>
<div class="record" id="record" hidden></div>
<div class="record" id="menu" hidden></div>
<input type="file" id="loadFile" accept=".json,.txt,application/json,text/plain" hidden>
<div class="objection" id="objection" hidden><div class="burst" id="burst"></div></div>

<script src="engine/parser.js" charset="utf-8"></script>
<script src="story/list.js" charset="utf-8"></script>
<script src="engine/engine.js" charset="utf-8"></script>
</body>
</html>
